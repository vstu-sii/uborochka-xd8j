name: Deploy production

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check .
      - name: Tests
        run: python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t uborochka:${GITHUB_SHA} .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "RENDER_DEPLOY_HOOK_URL is not configured" >&2
            exit 1
          }
          curl --fail --silent --show-error --output /dev/null \
            --max-time 30 "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for production health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null \
              --max-time 10 https://uborochka-xd8j.onrender.com/health; then
              echo "Production health check succeeded."
              exit 0
            fi
            echo "Health check attempt ${attempt}/30 failed; waiting 10 seconds."
            sleep 10
          done
          echo "Production did not become healthy after 30 attempts." >&2
          exit 1
