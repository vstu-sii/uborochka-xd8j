name: Roll back production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Git commit SHA to deploy
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trigger rollback deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TARGET_SHA: ${{ inputs.sha }}
        run: scripts/rollback.sh "$TARGET_SHA"
      - name: Wait for production health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null \
              --max-time 10 https://uborochka-xd8j.onrender.com/health; then
              echo "Rolled-back production health check succeeded."
              exit 0
            fi
            echo "Health check attempt ${attempt}/30 failed; waiting 10 seconds."
            sleep 10
          done
          echo "Production did not become healthy after rollback." >&2
          exit 1
