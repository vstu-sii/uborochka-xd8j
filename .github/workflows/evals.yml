name: Evals CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evals:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/evals/requirements.txt
    
    - name: Run baseline evals
      run: |
        python tests/evals/run_baseline.py
      env:
        GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
        GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
    
    - name: Check thresholds
      run: |
        python tests/evals/check_thresholds.py