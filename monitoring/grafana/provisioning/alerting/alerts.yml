apiVersion: 1

groups:
  - orgId: 1
    name: Usage anomaly alerts
    folder: Uborochka
    interval: 1m
    rules:
      - uid: uborochka-token-spike
        title: Аномальный расход токенов
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(increase(model_tokens_total[5m]))
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 1
              refId: B
              type: math
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Более одного токена модели за пять минут
          description: Smoke-test threshold; raise it to match expected production traffic.
        labels:
          severity: warning
      - uid: uborochka-user-limit
        title: Сработали лимиты пользователя
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(increase(limit_triggers_total[5m]))
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              refId: B
              type: math
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Превышен лимит пользователя
          description: Проверьте endpoint /inspection и категорию сработавшего лимита.
        labels:
          severity: warning
