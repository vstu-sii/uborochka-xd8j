apiVersion: 1

groups:
  - orgId: 1
    name: Usage anomaly alerts
    folder: Uborochka
    interval: 1m
    rules:
      - uid: uborochka-token-spike
        title: Paid model token usage detected
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(increase(model_tokens_total[5m]))
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A > 0
              refId: B
              type: math
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A model call used tokens in the last five minutes
          description: Confirm this usage is expected in the Uborochka dashboard.
        labels:
          severity: warning
