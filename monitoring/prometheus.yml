global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: uborochka
    metrics_path: /metrics
    # Optional: configure METRICS_TOKEN for the app, create monitoring/metrics_token,
    # add compose.metrics-auth.yml to the Compose command, then uncomment this block.
    # Prometheus does not support environment substitution in this config.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:8000"]
